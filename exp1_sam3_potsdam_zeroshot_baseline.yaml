# SAM3 零样本评估配置文件

# 路径配置
paths:
  base_dir: "/home/anjou/PythonENV/Test_11/Potsdam"
  output_dir: "/home/anjou/PythonENV/Test_11/results_exp1_sam3_potsdam_zeroshot_baseline"
  checkpoint_path: "/home/anjou/PythonENV/Test_11/sam3/checkpoints/sam3.1_multiplex.pt"

  # 图像和标签的子目录路径
  image_subdir: "2_Ortho_RGB/2_Ortho_RGB"
  label_subdir: "5_Labels_all_noBoundary"

  # 文件命名模式
  image_pattern: "{image_id}_RGB.tif"
  label_pattern: "{image_id}_label_noBoundary.tif"

# 模型加载配置
model:
  # 正式论文实验默认不允许隐式联网加载，避免 checkpoint 缺失时产生不可复现实验。
  # 如确需从 HuggingFace 加载模型，必须显式改为 true。
  allow_hf_fallback: false

# 评估配置
evaluation:
  # 默认自动发现 RGB 图像和 noBoundary 标签的完整文件交集。
  # 如需调试小样本，显式填写 test_images；留空则运行全部可配对样本。
  test_images: []

# 图像处理参数
image_processing:
  # SAM3 输入尺寸
  patch_size: 1008

  # 切片步长（控制重叠度）
  # - 1008: 无重叠（最快）
  # - 672: 1/3 重叠（推荐）
  # - 504: 50% 重叠（更高质量）
  stride: 672

  # mask 置信度阈值
  score_threshold: 0.5

# SAM3 文本提示配置
# Potsdam 的类别 ID、类别名称和官方颜色固定在代码 schema 中；
# 此处只配置 Exp1 零样本实验实际可调的类别文本提示。
prompts:
  class_0: "impervious surface"
  class_1: "building"
  class_2: "low vegetation"
  class_3: "tree"
  class_4: "car"
  class_5: "background clutter"

# 设备配置
device:
  # 设备选择: "auto", "cuda", "cpu"
  # 正式论文实验固定要求 CUDA，避免 CUDA 异常时误跑 CPU 全量评估。
  type: "cuda"

  # GPU 推理数据类型: "auto", "bfloat16", "float16", "float32"
  # 为尽量保持模型原始数值行为，默认使用 float32；脚本会在运行时安装兼容 fallback，不修改 SAM3 源码。
  gpu_dtype: "float32"

# 输出配置
output:
  # 是否保存预测标签和 GT 标签图像；metrics 始终保存。
  save_predictions: true

  # 是否保存可视化结果
  save_visualizations: true

  # 可视化图像的 DPI
  visualization_dpi: 150

  # 输出图像格式；当前支持 png/tif/tiff，默认 png。
  image_format: "png"

  # 日志级别: "DEBUG", "INFO", "WARNING", "ERROR"
  log_level: "INFO"

# 评估指标配置
metrics:
  # 是否保存数据集级混淆矩阵 CSV；JSON 中始终保存 dataset_confusion_matrix。
  save_confusion_matrix: false

  # 是否在 overall_metrics.json 中额外展开 dataset_iou_class_*/average_iou_class_* 等顶层字段。
  # per-class 数组指标始终保存。
  detailed_class_report: true
