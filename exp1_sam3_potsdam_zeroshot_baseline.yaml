# SAM3 零样本评估配置文件

# 路径配置
paths:
  base_dir: "/home/anjou/PythonENV/Test_11/Potsdam"
  output_dir: "/home/anjou/PythonENV/Test_11/results_exp1_sam3_potsdam_zeroshot_baseline"
  checkpoint_path: "/home/anjou/PythonENV/Test_11/sam3/checkpoints/sam3.1_multiplex.pt"

  # 图像和标签的子目录路径
  image_subdir: "2_Ortho_RGB/2_Ortho_RGB"
  label_subdir: "5_Labels_all_noBoundary"

  # 文件命名模式
  image_pattern: "{image_id}_RGB.tif"
  label_pattern: "{image_id}_label_noBoundary.tif"

# 评估配置
evaluation:
  # 评估模式: "quick" (快速验证) 或 "full" (完整评估)
  mode: "full"

  # 完整论文实验推荐从 RGB 图像和 noBoundary 标签的文件交集自动发现样本。
  # 当前 Potsdam 目录中可配对样本为 38 张。
  discover_from_files: true

  # 快速验证的测试图像列表（代表性场景组合）
  quick_test_images:
    - "top_potsdam_2_10"  # 简单城市场景
    - "top_potsdam_5_11"  # 中等复杂度场景
    - "top_potsdam_7_9"   # 复杂密集建筑场景

  # 完整评估时使用的数据范围（discover_from_files=false 时作为后备）
  full_test_range:
    # 按行号选择，如 ["2", "3", "4", "5", "6", "7"]
    rows: ["2", "3", "4", "5", "6", "7"]
    # 按列号选择，如 ["7", "8", "9", "10", "11", "12"]
    cols: ["7", "8", "9", "10", "11", "12"]

# 图像处理参数
image_processing:
  # SAM3 输入尺寸
  patch_size: 1008

  # 切片步长（控制重叠度）
  # - 1008: 无重叠（最快）
  # - 672: 1/3 重叠（推荐）
  # - 504: 50% 重叠（更高质量）
  stride: 672

  # mask 置信度阈值
  score_threshold: 0.5

  # NMS 阈值（如果需要）
  nms_threshold: 0.5

  # 每个类别最大预测数量（如果需要）
  max_predictions_per_class: 100

# Potsdam 类别配置
classes:
  # 类别数量
  num_classes: 6

  # 类别定义
  class_0:
    id: 0
    name: "impervious surface"
    prompt: "impervious surface"
    color: [255, 255, 255]  # 白色

  class_1:
    id: 1
    name: "building"
    prompt: "building"
    color: [0, 0, 255]  # 蓝色

  class_2:
    id: 2
    name: "low vegetation"
    prompt: "low vegetation"
    color: [0, 255, 255]  # 青色

  class_3:
    id: 3
    name: "tree"
    prompt: "tree"
    color: [0, 255, 0]  # 绿色

  class_4:
    id: 4
    name: "car"
    prompt: "car"
    color: [255, 255, 0]  # 黄色

  class_5:
    id: 5
    name: "clutter/background"
    prompt: "background clutter"
    color: [255, 0, 0]  # 红色

# 融合策略配置
fusion:
  # 融合策略说明：
  # 当前 Exp1 主流程实际使用固定的 confidence 置信度加权融合。
  # priority 和 combined 是预留设计，当前脚本不会根据该字段切换融合逻辑。
  #
  # 可选值含义：
  # - confidence: 基于 SAM3 mask score 的置信度加权融合（当前实际使用）
  # - priority: 基于人工类别优先级的融合（当前未启用）
  # - combined: 置信度与人工类别优先级组合融合（当前未启用）
  strategy: "confidence"

  # 类别优先级（如果使用 priority 策略）
  priority: [1, 3, 4, 2, 0, 5]  # building > tree > car > low vegetation > impervious > clutter

  # 是否考虑 mask 面积
  consider_area: false

  # 是否考虑空间一致性
  consider_spatial: false

# 设备配置
device:
  # 设备选择: "auto", "cuda", "cpu"
  # 正式论文实验固定要求 CUDA，避免 CUDA 异常时误跑 CPU 全量评估。
  type: "cuda"

  # GPU ID（如果有多个 GPU）
  gpu_id: 0

  # GPU 推理数据类型: "auto", "bfloat16", "float16", "float32"
  # 为尽量保持模型原始数值行为，默认使用 float32；脚本会在运行时安装兼容 fallback，不修改 SAM3 源码。
  gpu_dtype: "float32"

# 输出配置
output:
  # 是否保存预测标签
  save_predictions: true

  # 是否保存可视化结果
  save_visualizations: true

  # 可视化图像的 DPI
  visualization_dpi: 150

  # 是否保存中间结果（用于调试）
  save_intermediate: false

  # 输出图像格式
  image_format: "png"

  # 日志级别: "DEBUG", "INFO", "WARNING", "ERROR"
  log_level: "INFO"

# 性能优化
performance:
  # 批处理大小（如果支持）
  batch_size: 1

  # 数据加载线程数
  num_workers: 0

  # 是否预加载所有图像
  preload_images: false

  # 内存优化模式
  memory_efficient: true

# 提示工程（可选）
prompt_engineering:
  # 是否启用提示变体测试
  enable_variants: false

  # 提示变体列表（如果启用）
  variants:
    class_0:  # 不透水面
      - "impervious surface"
      - "road and pavement"
      - "hard surface"

    class_2:  # 低矮植被
      - "low vegetation"
      - "grass"
      - "lawn"

    class_3:  # 树木
      - "tree"
      - "trees"
      - "large trees"

# 评估指标配置
metrics:
  # 要计算的指标列表
  compute_metrics:
    - "overall_accuracy"
    - "mean_iou"
    - "mean_f1"
    - "mean_precision"
    - "mean_recall"
    - "frequency_weighted_iou"
    - "per_class_iou"
    - "per_class_f1"
    - "per_class_precision"
    - "per_class_recall"
    - "confusion_matrix"

  # 是否保存混淆矩阵可视化
  save_confusion_matrix: false

  # 是否生成详细的类别报告
  detailed_class_report: true
